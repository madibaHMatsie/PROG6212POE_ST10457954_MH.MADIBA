

name: CI - Validate Repository Structure

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: List directory structure
        run: |
          echo "Repository contents:"
          ls -la
      
      - name: Check for docs folder
        run: |
          if [ -d "docs" ]; then
            echo "✅ /docs folder exists"
            ls -la docs/
          else
            echo "❌ /docs folder not found"
            exit 1
          fi
      
      - name: Check for required files in /docs
        run: |
          required_files=("ERD.png" "API_Endpoint_Plan.md" "RaceDay_Schema.sql")
          missing_files=()
          
          for file in "${required_files[@]}"; do
            if [ -f "docs/$file" ]; then
              echo "✅ Found: docs/$file"
            else
              echo "❌ Missing: docs/$file"
              missing_files+=("$file")
            fi
          done
          
          # Check for PDF alternatives
          if [ ! -f "docs/ERD.png" ] && [ ! -f "docs/ERD.pdf" ]; then
            echo "❌ Missing: ERD.png or ERD.pdf"
            missing_files+=("ERD (PNG or PDF)")
          fi
          
          if [ ! -f "docs/API_Endpoint_Plan.md" ] && [ ! -f "docs/API_Endpoint_Plan.pdf" ]; then
            echo "❌ Missing: API_Endpoint_Plan.md or API_Endpoint_Plan.pdf"
            missing_files+=("API_Endpoint_Plan (MD or PDF)")
          fi
          
          if [ ${#missing_files[@]} -eq 0 ]; then
            echo "✅ All required files found in /docs"
            exit 0
          else
            echo " Missing required files: ${missing_files[*]}"
            exit 1
          fi
      
      - name: Validate SQL script
        run: |
          if [ -f "docs/RaceDay_Schema.sql" ]; then
            echo " SQL script found"
            if grep -q "CREATE TABLE" docs/RaceDay_Schema.sql; then
              echo " SQL script contains CREATE TABLE statements"
            else
              echo " Warning: No CREATE TABLE found"
            fi
          else
            echo " SQL script not found"
            exit 1
          fi
      
      - name: Check for README
        run: |
          if [ -f "README.md" ]; then
            echo " README.md found"
          else
            echo " README.md not found"
            exit 1
          fi
      
      - name: Build successful
        run: |
          echo "✅ Build successful - All checks passed!"
